name: A7 admission diagnosis (manual, read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Dytschgo/arxcovo' &&
      github.actor == 'Dytschgo' && github.triggering_actor == 'Dytschgo' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      vars.UNIX_EXECUTION_REVIEWED_SHA == '' &&
      vars.SUDO_PACKAGE_REVIEWED_SHA == '' &&
      vars.A7_ADMISSION_REVIEWED_SHA != '' &&
      github.sha == vars.A7_ADMISSION_REVIEWED_SHA &&
      github.workflow_sha == vars.A7_ADMISSION_REVIEWED_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      A7_ADMISSION_REVIEWED_SHA: ${{ vars.A7_ADMISSION_REVIEWED_SHA }}
      UNIX_EXECUTION_REVIEWED_SHA: ${{ vars.UNIX_EXECUTION_REVIEWED_SHA }}
      SUDO_PACKAGE_REVIEWED_SHA: ${{ vars.SUDO_PACKAGE_REVIEWED_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Safe mocked wrapper tests
        run: python3 -I -B tools/ci/test-a7-admission-readonly.py -v
      - name: Fixed read only diagnosis
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            CI=true GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" \
            RUNNER_ARCH="$RUNNER_ARCH" ImageOS="$ImageOS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_ACTOR="$GITHUB_ACTOR" GITHUB_TRIGGERING_ACTOR="$GITHUB_TRIGGERING_ACTOR" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            A7_ADMISSION_REVIEWED_SHA="$A7_ADMISSION_REVIEWED_SHA" \
            UNIX_EXECUTION_REVIEWED_SHA="$UNIX_EXECUTION_REVIEWED_SHA" \
            SUDO_PACKAGE_REVIEWED_SHA="$SUDO_PACKAGE_REVIEWED_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/tools/ci/a7-admission-readonly.py"
