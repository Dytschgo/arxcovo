name: S2b native evidence (non-required)
on:
  pull_request:
    paths:
      - 'crates/arxd/src/exec/cgroup.rs'
      - 'crates/arxd/src/exec/mod.rs'
      - 'crates/arxd/src/service/executor.rs'
      - 'crates/arxd/src/service/unix_bridge.rs'
      - 'crates/arxd/src/service/unix_bridge/tests.rs'
      - 'crates/arxd/src/service/unix_bridge/tests/e6.rs'
      - 'crates/arxd/src/service/unix_bridge/tests/s2b.rs'
      - '.github/workflows/s2b-native-evidence.yml'
      - 'tools/ci/s2b-native/**'
      - 'docs/evidence/linux-unwind-local-s2b-native.md'
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require ordinary numeric UID
        run: |
          uid=$(id -u)
          echo "S2b numeric UID=$uid"
          test "$uid" -ne 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest@0.9.151
      - name: Portable harness unit tests (synthetic only)
        run: python3 -I -B -m unittest discover -s tools/ci/s2b-native -p test_driver.py
      - name: Bounded native baselines and fixed mutations
        run: python3 -I -B tools/ci/s2b-native/driver.py
