name: CI policy
on:
  workflow_run:
    workflows: [CI, Policy signal]
    types: [requested, in_progress, completed]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: read
jobs:
  evaluate:
    if: github.event.action != 'in_progress' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: trusted-ci-policy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node scripts/ci-budget.mjs
        env:
          GH_TOKEN: ${{ github.token }}
