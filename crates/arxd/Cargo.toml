[package]
name = "arxd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
getrandom = "=0.3.4"
hex = "=0.4.3"
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server", "transport-io"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
sysinfo = "=0.37.2"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "io-std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["process"] }
rmcp = { version = "=3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream"] }
tempfile = "=3.23.0"
rand = "=0.9.2"
tokio-util = { version = "=0.7.19", features = ["io"] }
