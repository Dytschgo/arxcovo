[package]
name = "arxd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arx-guest = { path = "../arx-guest" }
ring = "=0.17.14"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "x509-parser"] }
x509-parser = { version = "=0.18.1", default-features = false }
time = { version = "=0.3.55", default-features = false }
anyhow = "=1.0.100"
axum = "=0.8.6"
getrandom = "=0.3.4"
hex = "=0.4.3"
futures-util = "=0.3.34"
openraft = { version = "=0.10.0", default-features = false, features = ["tokio-rt"] }
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server", "transport-io"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
sysinfo = "=0.37.2"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "io-std", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Services", "Win32_UI_Shell", "Win32_System_Com", "Win32_NetworkManagement_NetManagement", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Environment", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["process", "test-util"] }
rmcp = { version = "=3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream"] }
tempfile = "=3.23.0"
rand = "=0.9.2"
tokio-util = { version = "=0.7.19", features = ["io"] }
